[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roi-pipeline"
version = "0.1.0"
description = "Matrix-factorization ROI extraction for volumetric imaging movies, orchestrated by Airflow"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "zarr>=3.0",
    "tifffile>=2024.1",
    "pillow>=10",
]

[project.optional-dependencies]
# Enough to run the unit tests and the dashboard outside Docker.
dev = [
    "pytest>=8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "docker>=7.1",
]

[tool.setuptools]
packages = ["roi_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
